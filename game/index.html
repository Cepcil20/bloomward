<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BLOOMWARD — Night Garden Defense</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #050b07;
      background-image: radial-gradient(circle at 50% 30%, #0f2214 0%, #050b07 100%);
      color: #e0ffe8;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .game-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    h1 {
      margin: 0 0 6px 0;
      font-size: 24px;
      letter-spacing: 2px;
      color: #ffd700;
      text-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }
    canvas {
      border: 2px solid #1c3822;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), 0 0 15px rgba(46, 139, 87, 0.2);
      border-radius: 6px;
      background-color: #08110b;
      cursor: crosshair;
    }
    .controls-hint {
      margin-top: 10px;
      font-size: 13px;
      color: #7ba688;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>BLOOMWARD — Night Garden Defense</h1>
    <canvas id="game" width="960" height="640"></canvas>
    <div class="controls-hint">Controls: Click garden to plant tower • Select towers in nursery shop • Press Space / Click Start Wave</div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
